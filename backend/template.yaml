AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Open Menu

  Open menu backend project created with aws-sam with nodejs typescript

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito Hosted UI domain
  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/auth/callback
    Description: Allowed OAuth redirect URIs (your Next.js /auth/callback routes)
  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Allowed sign-out redirect URIs (no trailing slash)
  WebOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Origins allowed to upload images to S3 from the browser (CORS)
  GoogleClientId:
    Type: String
    Default: ''
    Description: Google OAuth client ID. Leave empty to disable "Continue with Google".
  GoogleClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Google OAuth client secret (keep it out of git, see README)

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, '']]

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 10
    Runtime: nodejs24.x
    Architectures:
      - x86_64

Resources:
  # ---------------------------------------------------------------------------
  # DynamoDB - single table
  #   Shop      PK=SHOP#<id>   SK=META              (GSI1PK=STATUS#<status>)
  #   Group     PK=SHOP#<id>   SK=GROUP#<id>
  #   Item      PK=SHOP#<id>   SK=ITEM#<id>
  #   Audit     PK=SHOP#<id>   SK=AUDIT#<iso>#<rnd>
  #   Slug      PK=SLUG#<slug> SK=META              (uniqueness lock -> shopId)
  #   OwnerShop PK=OWNER#<sub> SK=SHOP              (one shop per owner -> shopId)
  #   Owner     PK=OWNER#<sub> SK=PROFILE
  # ---------------------------------------------------------------------------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # ---------------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub openmenu-${Stage}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - {
            Name: email,
            AttributeDataType: String,
            Required: true,
            Mutable: true,
          }
      # Pre token generation V2 (access-token scopes) is only available on the Essentials / Plus feature plans.
      UserPoolTier: ESSENTIALS
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt PreTokenFunction.Arn
          LambdaVersion: V2_0

  OwnerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: owner
      Description: Shop owners
      UserPoolId: !Ref UserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Platform administrators (add users manually)
      UserPoolId: !Ref UserPool

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  # Google as an identity provider (only created when GoogleClientId is set).
  # In Google Cloud Console add this Authorized redirect URI to the OAuth client:
  #   https://<CognitoDomainPrefix>.auth.<region>.amazoncognito.com/oauth2/idpresponse   (see the GoogleRedirectUri output)
  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: 'openid email profile'
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # DependsOn: GoogleProvider # the provider must exist before the client can list it (ignored when HasGoogle is false)
    Properties:
      ClientName: !Sub open-menu-web-${Stage}
      UserPoolId: !Ref UserPool
      GenerateSecret: false # Authorization Code + PKCE; Next.js route handlers do the exchange
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders:
        !If [HasGoogle, [COGNITO, !Ref GoogleProvider], [COGNITO]]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/handlers/post-confirmation.ts]
    Properties:
      CodeUri: .
      Handler: post-confirmation.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - Statement:
            # Wildcard pool ARN avoids a circular dependency (pool -> function -> pool).
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Table.Arn

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # Links a first-time Google sign-in to an existing email/password account with the same verified email,
  # so owners never end up with two separate accounts (and "lose" their shop).
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/pre-signup.ts]
    Properties:
      CodeUri: .
      Handler: pre-signup.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminLinkProviderForUser
              Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PreSignUpFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # Turns Cognito group membership into OAuth scopes on the ACCESS token (owner / admin). No AWS calls, no IAM needed.
  PreTokenFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/handlers/pre-token.ts]
    Properties:
      CodeUri: .
      Handler: pre-token.handler
      Timeout: 5 # runs inside the sign-in flow: keep it fast (Cognito allows at most 5 s)

  PreTokenPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PreTokenFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------------------
  # HTTP API + JWT authorizer (Cognito ID token)
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          # Validates the Cognito ACCESS token: signature, expiry, issuer, client (its client_id claim must match the
          # audience below) and, per route, the required scope. ID tokens have no scope claim, so they are rejected.
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  # Everything behind the JWT authorizer. One function with an internal router keyed by routeKey.
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/handlers/api.ts]
    Properties:
      CodeUri: .
      Handler: api.handler
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Me:
          {
            Type: HttpApi,
            Properties:
              {
                ApiId: !Ref HttpApi,
                Method: GET,
                Path: /me,
                Auth:
                  {
                    Authorizer: CognitoJwt,
                    AuthorizationScopes: [openmenu/shop.read],
                  },
              },
          }
        CreateShop:
          {
            Type: HttpApi,
            Properties:
              {
                ApiId: !Ref HttpApi,
                Method: POST,
                Path: /shops,
                Auth:
                  {
                    Authorizer: CognitoJwt,
                    AuthorizationScopes: [openmenu/shop.write],
                  },
              },
          }
        GetShop:
          {
            Type: HttpApi,
            Properties:
              {
                ApiId: !Ref HttpApi,
                Method: GET,
                Path: '/shops/{shopId}',
                Auth:
                  {
                    Authorizer: CognitoJwt,
                    AuthorizationScopes: [openmenu/shop.read],
                  },
              },
          }
        UpdateShop:
          {
            Type: HttpApi,
            Properties:
              {
                ApiId: !Ref HttpApi,
                Method: PUT,
                Path: '/shops/{shopId}',
                Auth:
                  {
                    Authorizer: CognitoJwt,
                    AuthorizationScopes: [openmenu/shop.write],
                  },
              },
          }
        SubmitShop:
          {
            Type: HttpApi,
            Properties:
              {
                ApiId: !Ref HttpApi,
                Method: POST,
                Path: '/shops/{shopId}/submit',
                Auth:
                  {
                    Authorizer: CognitoJwt,
                    AuthorizationScopes: [openmenu/shop.write],
                  },
              },
          }

Outputs:
  ApiUrl:
    Description: Put this in web/.env.local as API_URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  CognitoDomain:
    Description: Put this in web/.env.local as COGNITO_DOMAIN
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  UserPoolId:
    Description: nextjs/.env.local COGNITO_USER_POOL_ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: nextjs/.env.local COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
  TableName:
    Description: DynamoDB table (used by the seed script)
    Value: !Ref Table
  GoogleRedirectUri:
    Description: Add this as an Authorized redirect URI on your Google OAuth client
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse
