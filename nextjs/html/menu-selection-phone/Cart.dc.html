</div>

<div style="min-width: 0; flex: 1">

<span style="width: 72px; text-align: right; font-size: 15px; font-weight: 600">₹190.00</span>

</ul>

<div style="margin-top: 8px; padding-top: 16px; border-top: 1px solid #E7E5E4; display: flex; align-items: baseline; justify-content: space-between">

<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">₹270.00</span>
